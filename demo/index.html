<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genetic Assembly - NSGA-II Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        input, select {
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .results {
            margin-top: 30px;
        }
        .status {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: 500;
        }
        .status.info {
            background: #e3f2fd;
            color: #1976d2;
        }
        .status.success {
            background: #e8f5e9;
            color: #388e3c;
        }
        .status.error {
            background: #ffebee;
            color: #c62828;
        }
        .pareto-front {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
        }
        .pareto-front pre {
            margin: 0;
            font-size: 12px;
            white-space: pre-wrap;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧬 Genetic Assembly - NSGA-II Demo</h1>
        <p class="subtitle">WebAssembly-powered Multi-Objective Optimization with Web Workers</p>
        
        <div class="controls">
            <div class="control-group">
                <label for="algorithm">Algorithm:</label>
                <select id="algorithm">
                    <option value="nsga2">NSGA-II</option>
                    <option value="nsga3">NSGA-III</option>
                </select>
            </div>
            <div class="control-group">
                <label for="numVars">Number of Variables:</label>
                <input type="number" id="numVars" value="5" min="2" max="20">
            </div>
            <div class="control-group">
                <label for="popSize">Population Size:</label>
                <input type="number" id="popSize" value="50" min="10" max="500">
            </div>
            <div class="control-group">
                <label for="generations">Generations:</label>
                <input type="number" id="generations" value="100" min="10" max="1000">
            </div>
            <div class="control-group">
                <label for="crossoverRate">Crossover Rate:</label>
                <input type="number" id="crossoverRate" value="0.9" min="0" max="1" step="0.1">
            </div>
            <div class="control-group">
                <label for="mutationRate">Mutation Rate:</label>
                <input type="number" id="mutationRate" value="0.1" min="0" max="1" step="0.05">
            </div>
        </div>
        
        <button id="runBtn" onclick="runOptimization()">Run Optimization</button>
        
        <div class="results" id="results" style="display: none;">
            <div class="status" id="status"></div>
            <div class="stats" id="stats"></div>
            <div class="pareto-front">
                <strong>Pareto Front Solutions:</strong>
                <pre id="paretoOutput"></pre>
            </div>
        </div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
