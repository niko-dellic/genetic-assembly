<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genetic Assembly - NSGA-II Demo</title>
    <link rel="stylesheet" href="/styles/styles.css" />
    <style>
      /* Navigation bar */
      .nav-bar {
        background: var(--background-color-light);
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 25px;
        border: 1px solid var(--border-color);
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .nav-bar a {
        padding: 8px 16px;
        background: var(--background-color);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        text-decoration: none;
        color: var(--text-color);
        transition: all 0.2s;
        font-size: 14px;
      }

      .nav-bar a:hover {
        background: var(--primary-color);
        color: white;
        border-color: var(--primary-color);
      }

      .nav-bar a.active {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-color: transparent;
      }

      /* Page-specific styles */
      .pareto-front {
        background: var(--background-color-light);
        padding: 15px;
        border-radius: 6px;
        overflow-x: auto;
        border: 1px solid var(--border-color);
        margin-top: 15px;
      }

      .pareto-front pre {
        margin: 0;
        font-size: 12px;
        white-space: pre-wrap;
        color: var(--text-color);
      }

      .pareto-front strong {
        color: var(--text-color);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
        margin-top: 15px;
      }

      .stat-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 15px;
        border-radius: 6px;
        text-align: center;
      }

      .stat-value {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 5px;
      }

      .stat-label {
        font-size: 12px;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <nav class="nav-bar">
        <a href="index.html" class="active">🔬 Basic NSGA-II</a>
        <a href="landuse.html">🏢 Land Use Optimizer</a>
        <a href="threejs.html">🎨 Three.js Integration</a>
      </nav>

      <h1>🧬 Genetic Assembly - Parallel NSGA-II Demo</h1>
      <p class="subtitle">
        WebAssembly-powered Multi-Objective Optimization with Parallel Island
        Model
      </p>

      <div class="section-title">Algorithm Parameters</div>
      <div class="controls">
        <div class="control-group">
          <label for="algorithm">Algorithm:</label>
          <select id="algorithm">
            <option value="nsga2">NSGA-II</option>
            <option value="nsga3">NSGA-III</option>
          </select>
        </div>
        <div class="control-group">
          <label for="numVars">Number of Variables:</label>
          <input type="number" id="numVars" value="5" min="2" max="20" />
        </div>
        <div class="control-group">
          <label for="popSize">Size (Per Worker):</label>
          <input type="number" id="popSize" value="50" min="10" max="500" />
        </div>
        <div class="control-group">
          <label for="generations">Generations:</label>
          <input
            type="number"
            id="generations"
            value="100"
            min="10"
            max="1000"
          />
        </div>
        <div class="control-group">
          <label for="crossoverRate">Crossover Rate:</label>
          <input
            type="number"
            id="crossoverRate"
            value="0.9"
            min="0"
            max="1"
            step="0.1"
          />
        </div>
        <div class="control-group">
          <label for="mutationRate">Mutation Rate:</label>
          <input
            type="number"
            id="mutationRate"
            value="0.1"
            min="0"
            max="1"
            step="0.05"
          />
        </div>
      </div>

      <div class="section-title">Parallel Execution Settings</div>
      <div class="controls">
        <div class="control-group">
          <label for="numWorkers">Number of Workers:</label>
          <input type="number" id="numWorkers" min="1" max="16" />
        </div>
        <div class="control-group">
          <label for="migrationInterval"
            >Migration Interval (generations):</label
          >
          <input
            type="number"
            id="migrationInterval"
            value="20"
            min="5"
            max="100"
          />
        </div>
        <div class="control-group">
          <label for="migrationRate">Migration Rate:</label>
          <input
            type="number"
            id="migrationRate"
            value="0.1"
            min="0.01"
            max="0.5"
            step="0.05"
          />
        </div>
      </div>

      <button onclick="reinitializePool()">Reinitialize</button>

      <button id="runBtn" onclick="runOptimization()">
        Run Parallel Optimization
      </button>

      <div class="worker-grid">
        <div class="section-title">Worker Status</div>
        <div class="worker-status" id="workerStatus">
          <div
            style="
              color: var(--text-color-muted);
              text-align: center;
              padding: 20px;
            "
          >
            Initializing workers...
          </div>
        </div>
      </div>

      <div class="results" id="results" style="display: none">
        <div class="status" id="status"></div>
        <div class="stats" id="stats"></div>
        <div class="pareto-front">
          <strong>Pareto Front Solutions:</strong>
          <pre id="paretoOutput"></pre>
        </div>
      </div>
    </div>

    <script>
      // Set default number of workers based on hardware
      document.addEventListener("DOMContentLoaded", () => {
        const numWorkersInput = document.getElementById("numWorkers");
        numWorkersInput.value = navigator.hardwareConcurrency || 4;
      });
    </script>

    <script type="module" src="/src/basic/main.ts"></script>
  </body>
</html>
