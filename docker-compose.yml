services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: genetic_assembly
      POSTGRES_USER: genetic_assembly
      POSTGRES_PASSWORD: genetic_assembly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genetic_assembly -d genetic_assembly"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "${GA_POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  server:
    build: .
    environment:
      DATABASE_URL: postgres://genetic_assembly:genetic_assembly@postgres:5432/genetic_assembly
      GA_BIND: 0.0.0.0:3001
      GA_ARTIFACT_ROOT: /var/lib/genetic-assembly/artifacts
      RUST_LOG: genetic_assembly_server=info,tower_http=info
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "3001:3001"
    volumes:
      - artifact-data:/var/lib/genetic-assembly/artifacts
      - .:/workspace:ro

  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: genetic_assembly
      MINIO_ROOT_PASSWORD: genetic_assembly_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  artifact-data:
  minio-data:
